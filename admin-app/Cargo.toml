[workspace]
resolver = "2"
members = ["src-tauri", "crates/admin-core", "crates/admin-wasm"]
# admin-wasm only builds for wasm32-unknown-unknown; keep it out of host builds.
default-members = ["src-tauri", "crates/admin-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Formstr"]

[workspace.dependencies]
admin-core = { path = "crates/admin-core" }
bitcoin_hashes = "1.2"
# nostr 0.45.0 gates nip49's Error::crypto helper behind nip46/nip59; nip59 is the smaller fix.
nostr = { version = "=0.45.0", features = ["nip49", "nip59", "nip98", "os-rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zeroize = "1.8"
