[package]
name = "nostr-storage-admin"
version = "0.1.0"
description = "Nostr Storage Orchestrator administration client"
authors = ["Formstr"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nostr_storage_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
bitcoin_hashes = "1.2"
# nostr 0.45.0 gates nip49's Error::crypto helper behind nip46/nip59; nip59 is the smaller fix.
nostr = { version = "=0.45.0", features = ["nip49", "nip59", "nip98", "os-rng"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = [] }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
