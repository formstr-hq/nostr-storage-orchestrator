# Overlay connecting db-api to the storage backend's docker network so
# formstr-backend can call the entitlement endpoints directly as `db:4000`
# (no host gateway). formstr-backend's own compose project declares this
# network as external, so create it once before using this overlay:
#
#   docker network inspect formstr >/dev/null 2>&1 || docker network create formstr
#   docker compose -f docker-compose.yml -f compose.storage-backend.yml up -d
#
# Optional: without it, point the backend at a host-reachable DB_API_URL
# instead (e.g. http://host.docker.internal:4000).
services:
  db:
    networks:
      - default
      - storage-backend

networks:
  storage-backend:
    external: true
    name: formstr
