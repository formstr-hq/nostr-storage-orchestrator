[package]
name = "control-plane-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
ipnet = "2.11.0"
nostr = { version = "=0.45.0", features = ["nip98"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.4"

[dev-dependencies]
nostr = { version = "=0.45.0", features = ["nip98", "os-rng", "rand"] }
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
