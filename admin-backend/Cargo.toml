[package]
name = "admin-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
nostr = { version = "=0.45.0", features = ["nip98"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.4"

[dev-dependencies]
nostr = { version = "=0.45.0", features = ["nip98", "os-rng", "rand"] }
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
