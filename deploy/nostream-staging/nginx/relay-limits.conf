# Per-IP connection limits for the nostr relay backends.
#
# The relay holds a DB-pool connection per in-flight subscription/event
# handler. A client opening many connections in a burst can starve the pool,
# which then wedges every write with "KnexTimeoutError: Timeout acquiring a
# connection". Observed on 2026-09-18: ~600 connection aborts in 30 min from
# one IP, then writes failed relay-wide until nostream was restarted.
#
# Keys on $binary_remote_addr (the real client IP; nginx is the edge, there is
# no CDN in front). Set generous limits: a normal client uses 1-2 WebSocket
# connections. limit_conn bounds concurrency (the pool-starvation vector);
# limit_req bounds connection churn (open/abort floods).
#
# Applied in each relay vhost location block:
#   limit_conn relay_conn 30;
#   limit_req  zone=relay_connrate burst=20 nodelay;

limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_req_zone  $binary_remote_addr zone=relay_connrate:10m rate=10r/s;
