port: 3000
host: 0.0.0.0

database:
  path: data/sqlite.db

storage:
  backend: local
  local:
    dir: ./data/blobs
  # No expiry rules. A rule here prunes any blob that has gone unaccessed for
  # the given time, which would silently delete a paying customer's backup.
  # Retention is owned by the orchestrator's plan lifecycle (grace -> blocked ->
  # purge), never by the storage node.
  rules: []
  removeWhenNoOwners: true

# This server is an internal storage node behind the orchestrator proxy.
# The proxy is the auth gate; disable auth here so the proxy can upload
# and delete without needing to forward user tokens.
upload:
  enabled: true
  requireAuth: false

mirror:
  enabled: false
  requireAuth: false

delete:
  requireAuth: false

list:
  enabled: false

media:
  enabled: false

landing:
  enabled: false

report:
  enabled: false

dashboard:
  enabled: false
