services:
  relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: strfry
    restart: unless-stopped

    ports:
      - "7777:7777"

    volumes:
      - ./data/strfry:/app/db
      - ./strfry/strfry.conf:/etc/strfry.conf

    command: ["relay"]

  blossom:
    build: ./blossom
    container_name: blossom
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data/blossom:/app/data
      - ./blossom/config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s