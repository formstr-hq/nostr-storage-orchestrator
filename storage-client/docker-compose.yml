# NVPN mesh topology for a storage-client backend. blossom/strfry are only
# reachable over the NVPN mesh (or loopback) — no host-published ports — and
# no `container_name:` so multiple storage-client stacks can run on one
# Docker host with distinct Compose project names. See
# ../docs/NVPN_SIDECAR_PLAN.md section 4. For local dev/smoke-testing without
# a mesh, use docker-compose.dev.yml instead.
#
# Direct client UDP (optional, off by default — see compose.direct-udp.yml):
#   docker compose -f docker-compose.yml -f compose.direct-udp.yml up -d --build
services:
  nvpn:
    extends:
      file: ../nvpn/compose.yml
      service: nvpn
    environment:
      NVPN_ROLE: client
      NVPN_MESH_INPUT_PORTS: "3000,7777,3300"
    volumes:
      - nvpn_data:/data

  # strfry runs as uid 1000, but RELAY_DATA_PATH is created root-owned — by
  # Docker on a fresh machine, or by an earlier `sudo docker compose` run —
  # which makes strfry die with `mdb_env_open: Permission denied`. This
  # one-shot root container fixes the ownership before the relay starts,
  # rather than overriding the image's non-root user.
  relay-init:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    user: "0:0"
    volumes:
      - ${RELAY_DATA_PATH}:/db
    command: ["chown", "-R", "1000:1000", "/db"]

  # Mesh-PG data plane: postgres holds mesh_pg_* tables; pg-agent exposes the
  # /pg/* API the orchestrator's pg-gateway calls over the NVPN mesh. Postgres
  # itself is never exposed — only pg-agent's port is.
  mesh-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MESH_PG_USER:-mesh}
      POSTGRES_PASSWORD: ${MESH_PG_PASSWORD:-mesh}
      POSTGRES_DB: ${MESH_PG_DATABASE:-mesh}
    volumes:
      - ${MESH_PG_DATA_PATH:-./data/mesh-pg}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${MESH_PG_USER:-mesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-agent:
    build: ./pg-agent
    restart: unless-stopped
    network_mode: "service:nvpn"
    depends_on:
      nvpn:
        condition: service_healthy
        restart: true
      mesh-postgres:
        condition: service_healthy
    environment:
      PG_AGENT_PORT: "${PG_AGENT_PORT:-3300}"
      PG_AGENT_TOKEN: "${PG_AGENT_TOKEN:-}"
      MESH_PG_HOST: mesh-postgres
      MESH_PG_PORT: "5432"
      MESH_PG_DATABASE: ${MESH_PG_DATABASE:-mesh}
      MESH_PG_USER: ${MESH_PG_USER:-mesh}
      MESH_PG_PASSWORD: ${MESH_PG_PASSWORD:-mesh}
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:' + (Deno.env.get('PG_AGENT_PORT') ?? '3300') + '/pg/health'); if (!r.ok) Deno.exit(1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  relay:
    # Pinned by digest: upstream publishes only a `latest` tag and retags it,
    # and one such retag switched the runtime user from root to uid 1000 —
    # exactly the silent break `latest` invites.
    image: ghcr.io/hoytech/strfry:latest@sha256:9dd7646202dc494a351957505ab3accd9045b8626eff99fafc0a0075d7d9b322
    restart: unless-stopped
    network_mode: "service:nvpn"
    depends_on:
      nvpn:
        condition: service_healthy
        restart: true
      relay-init:
        condition: service_completed_successfully

    volumes:
      - ${RELAY_DATA_PATH}:/app/db
      - ./strfry/strfry.conf:/etc/strfry.conf

    command: ["relay"]

  blossom:
    build: ./blossom
    restart: unless-stopped
    network_mode: "service:nvpn"
    depends_on:
      nvpn:
        condition: service_healthy
        restart: true
    volumes:
      - ${BLOSSOM_DATA_PATH}:/app/data
      - ./blossom/config.yml:/app/config.yml:ro
    healthcheck:
      # The Deno image ships neither wget nor curl, so probing with either
      # can never succeed — the container would sit "unhealthy" forever and
      # any `condition: service_healthy` on it would block. `deno eval` has
      # implicit permissions and exits non-zero on a failed fetch.
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:3000/health'); if (!r.ok) Deno.exit(1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  storage-agent:
    profiles: ["agent"]
    build: ./storage-agent
    restart: unless-stopped
    network_mode: "service:nvpn"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      # Optional overrides. Normally both values are derived from the imported
      # invite and the sole peer route on nvpn0.
      CONTROL_PLANE_HOST_NPUB: "${CONTROL_PLANE_HOST_NPUB:-}"
      CONTROL_PLANE_HOST_TUNNEL_IP: "${CONTROL_PLANE_HOST_TUNNEL_IP:-}"
      CONTROL_PLANE_API_PORT: "${CONTROL_PLANE_API_PORT:-3002}"
      NVPN_TUN_IFACE: "${NVPN_TUN_IFACE:-nvpn0}"
      BLOSSOM_DATA_PATH: /storage/blossom
      RELAY_DATA_PATH: /storage/strfry
      BLOSSOM_PORT: "${BLOSSOM_PORT:-3000}"
      NOSTR_PORT: "${NOSTR_PORT:-7777}"
      AGENT_HEALTH_PORT: "${AGENT_HEALTH_PORT:-3010}"
      PING_INTERVAL_SECS: "${PING_INTERVAL_SECS:-300}"
      PING_RETRY_SECS: "${PING_RETRY_SECS:-15}"
    depends_on:
      nvpn:
        condition: service_healthy
        restart: true
    volumes:
      - ${BLOSSOM_DATA_PATH}:/storage/blossom:ro
      - ${RELAY_DATA_PATH}:/storage/strfry:ro
      # Identity only: storage-agent never executes nvpn and shares no PID namespace.
      - nvpn_data:/data:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/storage-agent", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nvpn_data:
