services:
  relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: strfry
    restart: unless-stopped

    ports:
      - "7777:7777"

    volumes:
      - ./data/strfry:/app/db
      - ./strfry/strfry.conf:/etc/strfry.conf

    command: ["relay"]

  blossom:
    build: ./blossom
    container_name: blossom
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data/blossom:/app/uploads
    environment:
      NODE_ID : node-1