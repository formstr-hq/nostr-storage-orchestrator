[package]
name = "storage-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.4"
nix = { version = "0.30.1", features = ["fs"] }
nostr = { version = "=0.45.1", features = ["nip98", "os-rng", "rand"] }
reqwest = { version = "0.12.22", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.4"

[profile.release]
lto = "thin"
strip = true
