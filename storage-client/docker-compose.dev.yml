# Meshless development/smoke-test topology — no NVPN sidecar, backends
# published directly on the host as before. Production uses
# storage-client/docker-compose.yml (NVPN mesh) instead; see
# ../docs/NVPN_SIDECAR_PLAN.md section 6.
#
# Usage: docker compose -f docker-compose.dev.yml up --build
# (../scripts/docker-smoke-test.sh and ./scripts/start.sh select this file.)
services:
  # See the same service in docker-compose.yml — strfry runs as uid 1000 but
  # ./data/strfry is created root-owned, so it needs chowning first or strfry
  # dies with `mdb_env_open: Permission denied`.
  relay-init:
    image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    user: "0:0"
    volumes:
      - ./data/strfry:/db
    command: ["chown", "-R", "1000:1000", "/db"]

  relay:
    # Pinned by digest — upstream publishes only `latest` and retags it; one
    # such retag switched the runtime user from root to uid 1000.
    image: ghcr.io/hoytech/strfry:latest@sha256:9dd7646202dc494a351957505ab3accd9045b8626eff99fafc0a0075d7d9b322
    container_name: strfry
    restart: unless-stopped
    depends_on:
      relay-init:
        condition: service_completed_successfully

    ports:
      - "7777:7777"

    volumes:
      - ./data/strfry:/app/db
      - ./strfry/strfry.conf:/etc/strfry.conf

    command: ["relay"]

  # Mesh-PG data plane (dev topology — ports published on loopback).
  mesh-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: mesh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MESH_PG_USER:-mesh}
      POSTGRES_PASSWORD: ${MESH_PG_PASSWORD:-mesh}
      POSTGRES_DB: ${MESH_PG_DATABASE:-mesh}
    volumes:
      - ./data/mesh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${MESH_PG_USER:-mesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-agent:
    build: ./pg-agent
    container_name: pg_agent
    restart: unless-stopped
    depends_on:
      mesh-postgres:
        condition: service_healthy
    ports:
      - "${PG_AGENT_PORT:-3300}:3300"
    environment:
      PG_AGENT_PORT: "${PG_AGENT_PORT:-3300}"
      PG_AGENT_TOKEN: "${PG_AGENT_TOKEN:-}"
      MESH_PG_HOST: mesh-postgres
      MESH_PG_PORT: "5432"
      MESH_PG_DATABASE: ${MESH_PG_DATABASE:-mesh}
      MESH_PG_USER: ${MESH_PG_USER:-mesh}
      MESH_PG_PASSWORD: ${MESH_PG_PASSWORD:-mesh}
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:' + (Deno.env.get('PG_AGENT_PORT') ?? '3300') + '/pg/health'); if (!r.ok) Deno.exit(1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  blossom:
    build: ./blossom
    container_name: blossom
    ports:
      - "${BLOSSOM_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - ./data/blossom:/app/data
      - ./blossom/config.yml:/app/config.yml:ro
    healthcheck:
      # See docker-compose.yml — the Deno image has no wget/curl, so the
      # probe has to go through `deno eval`. scripts/docker-smoke-test.sh
      # waits on this healthcheck, so a probe that can never pass turns into
      # a 120s hang followed by a spurious failure.
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:3000/health'); if (!r.ok) Deno.exit(1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
