# version: "3.9"
#
# NVPN mesh production topology — blossom reaches storage-client backends
# over a private NVPN mesh confined to the `nvpn` sidecar's network namespace;
# the host itself never joins the mesh. See docs/NVPN_SIDECAR_PLAN.md and
# nvpn/README.md. For local dev/smoke-testing without a mesh, use
# docker-compose.dev.yml instead.
#
# All config (server locations, credentials, ports) lives in a single root
# .env file — copy .env.example to .env and edit as needed:
#   cp .env.example .env
# It's read two ways: interpolated directly into this file via ${VAR}
# (needed for e.g. `ports:` mappings, resolved at `docker compose` parse
# time), and injected into each container's runtime environment via
# `env_file:`.
#
# Bridge networking + published ports so this works on macOS Docker Desktop
# as well as Linux. Host-published backends (storage-client) are reached via
# host.docker.internal. For Linux mesh-VPN / MagicDNS host networking, use:
#   docker compose -f docker-compose.host.yml up --build
#
# Every service below belongs to Compose profiles, so commands select the
# stack they want with --profile. `full` is everything:
#   docker compose --profile full up -d --build     # everything
#   docker compose --profile blossom up -d --build  # storage only: postgres,
#                                                   # db, nvpn, blossom, notifier
#   docker compose --profile admin up -d --build    # + control plane
#   docker compose --profile pg up -d --build       # + mesh-PG gateway
# Combine stacks with repeated flags, e.g. --profile blossom --profile admin.

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: nso_postgres
    profiles: ["blossom", "admin", "pg", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
    # Not published to the host by default — db-api reaches it over the
    # internal compose network. Uncomment to inspect it directly (e.g. with
    # `prisma studio` or `psql`); POSTGRES_PORT is set in .env.
    # ports:
    #   - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - nso_postgres_data:/var/lib/postgresql/data
    # Without this the container is created with `restart: no`: a host reboot
    # (or any explicit stop) leaves Postgres down permanently while every
    # `unless-stopped` sibling comes back. That happened 2026-10-17 and took
    # the relay, db-api, admin and pg-gateway down with it.
    restart: unless-stopped
    healthcheck:
      # -h 127.0.0.1 forces a real TCP check; without it, pg_isready can
      # report healthy during postgres's transient socket-only init phase.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-orchestrator}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    build:
      context: .
      dockerfile: ./packages/db/Dockerfile
    container_name: nso_db
    profiles: ["blossom", "admin", "pg", "full"]
    env_file:
      - ./.env
    environment:
      # Always talk to the compose-managed postgres service above — only
      # the host/port need overriding here (plain literals; POSTGRES_USER/
      # PASSWORD/DB still come from .env via env_file). Compose has no way
      # to URL-encode a password, so credentials are never built into a
      # connection string here — see packages/db/src/prisma.ts and
      # prisma.config.ts, which derive DATABASE_URL themselves and handle
      # this correctly. Point this at an external database (e.g. Neon) by
      # setting DATABASE_URL directly in .env instead.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      STORAGE_ACTIVE_WINDOW_SECS: "${ACTIVE_FRESHNESS_SECS:-960}"
    # Internal-only: no host port is published here. Sibling services (proxy,
    # notifier, pg-gateway, control plane) reach it at db:$DB_API_PORT over the
    # compose network; external callers (formstr-backend, UIs) go through
    # proxy/blossom, which proxies to db-api.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${DB_API_PORT:-4000}/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "unless-stopped"

  nvpn:
    extends:
      file: ./nvpn/compose.yml
      service: nvpn
    container_name: nso_nvpn
    profiles: ["blossom", "admin", "pg", "full"]
    environment:
      NVPN_ROLE: proxy
      NVPN_PUBLIC_INPUT_PORTS: "${BLOSSOM_PORT:-3001},${ADMIN_API_PORT:-3002},${PG_GATEWAY_PORT:-55432}"
      # Storage agents reach the control plane over the encrypted mesh.
      NVPN_MESH_INPUT_PORTS: "${ADMIN_API_PORT:-3002}"
    volumes:
      - nvpn_data:/data
    ports:
      - "${BLOSSOM_PORT:-3001}:${BLOSSOM_PORT:-3001}"
      # The admin API is reachable off-container only through local nginx.
      - "127.0.0.1:${ADMIN_API_PORT:-3002}:${ADMIN_API_PORT:-3002}"
      # pgwire for mesh-PG clients (nostream, psql). Loopback for ops; the
      # 172.17.0.1 binding lets sibling compose networks reach the gateway
      # via host-gateway. The port is a public input on the sidecar's
      # firewall so the published-port path (docker-proxy on the bridge)
      # reaches the gateway's netns listener.
      - "127.0.0.1:${PG_GATEWAY_PORT:-55432}:5432"
      - "172.17.0.1:${PG_GATEWAY_PORT:-55432}:5432"
      - "${NVPN_LISTEN_PORT:-51820}:${NVPN_LISTEN_PORT:-51820}/udp"

  admin:
    build:
      context: .
      dockerfile: ./control-plane-backend/Dockerfile
    container_name: nso_admin
    profiles: ["admin", "full"]
    network_mode: "service:nvpn"
    # `nvpn status --json` reports live daemon state (connected peers,
    # handshake/traffic counters) only when it can see the daemon's PID as
    # alive — config-only operations like create-invite don't need this and
    # work without it. network_mode above shares the network namespace but
    # not PID, so from here the daemon's pid_file (readable, since /data is
    # shared) points at a PID with no matching process in this container's
    # own PID namespace, and status silently reports no `state`. Sharing PID
    # here mirrors the network trust boundary already established above.
    pid: "service:nvpn"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      # nVPN resolves identity files relative to the same homes used by the
      # sidecar. Both services access the shared state through nvpn_data.
      ADMIN_ALLOWED_PUBKEYS: "${ADMIN_ALLOWED_PUBKEYS:-}"
      ADMIN_API_PORT: "${ADMIN_API_PORT:-3002}"
      ADMIN_PUBLIC_URL: "${ADMIN_PUBLIC_URL:-}"
      CONTROL_PLANE_MESH_URL: "${CONTROL_PLANE_MESH_URL:-}"
      DB_API_URL: "http://db:${DB_API_PORT:-4000}"
      NVPN_PRIVATE_CIDR: "${NVPN_PRIVATE_CIDR:-10.44.0.0/16}"
      ACTIVE_FRESHNESS_SECS: "${ACTIVE_FRESHNESS_SECS:-960}"
      PENDING_REAP_SECS: "${PENDING_REAP_SECS:-86400}"
      PING_PEER_CACHE_SECS: "${PING_PEER_CACHE_SECS:-15}"
      HOME: /data/home
      XDG_CONFIG_HOME: /data/config
      NVPN_CONFIG: /data/config/nvpn/config.toml
    volumes:
      - nvpn_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      db:
        condition: service_healthy
      nvpn:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  blossom:
    build:
      context: .
      dockerfile: ./proxy/blossom/Dockerfile
      args:
        # formstr-backend origin baked into the console SPA at build time:
        # the same browser-reachable FORMSTR_BACKEND_URL the proxy uses for
        # admin-check/storage-notify. Changing it needs a blossom rebuild.
        VITE_BACKEND_URL: "${FORMSTR_BACKEND_URL:-http://localhost:5000}"
    container_name: nso_blossom
    profiles: ["blossom", "full"]
    # Shares the nvpn sidecar's network namespace instead of the bridge
    # network: BLOSSOM_SERVERS can point at a storage-client's mesh tunnel IP
    # (10.44.x.y), reachable only from inside that namespace — the host
    # itself never joins the mesh. No `ports:` here; the nvpn service above
    # publishes BLOSSOM_PORT for the whole shared namespace. db-api stays
    # reachable at db:$DB_API_PORT via the sidecar's own bridge attachment.
    network_mode: "service:nvpn"
    env_file:
      - ./.env
    environment:
      # In the nvpn sidecar's namespace `localhost` is the sidecar, not the
      # host — db-api's 127.0.0.1-bound published port is unreachable from
      # here. Reach it by service name over the sidecar's bridge attachment
      # instead (the code's default is localhost:$DB_API_PORT, which is only
      # right for local dev and docker-compose.dev.yml).
      DB_API_URL: http://db:${DB_API_PORT:-4000}
      LIFECYCLE_CONFIG_PATH: /app/config/lifecycle.yml
    volumes:
      - ./config/lifecycle.yml:/app/config/lifecycle.yml:ro
    depends_on:
      db:
        condition: service_healthy
      nvpn:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # Lifecycle scheduler: mirrors User.status from derived dates, sends
  # expiry/quota/moderation notifications over NIP-17 DM + email, and (when
  # purgeEnabled) calls the proxy's internal purge endpoint.
  notifier:
    build:
      context: .
      dockerfile: ./packages/notifier/Dockerfile
    container_name: nso_notifier
    profiles: ["blossom", "full"]
    # Shares the nvpn sidecar namespace so it can call the proxy's internal
    # purge endpoint on localhost:$BLOSSOM_PORT. db-api is still reached at
    # db:$DB_API_PORT via the sidecar's bridge attachment.
    network_mode: "service:nvpn"
    env_file:
      - ./.env
    environment:
      DB_API_URL: http://db:${DB_API_PORT:-4000}
      LIFECYCLE_CONFIG_PATH: /app/config/lifecycle.yml
      BLOSSOM_INTERNAL_URL: http://localhost:${BLOSSOM_PORT:-3001}
    volumes:
      - ./config/lifecycle.yml:/app/config/lifecycle.yml:ro
    depends_on:
      db:
        condition: service_healthy
      blossom:
        condition: service_started
    restart: unless-stopped

  # Mesh-PG data plane: pgwire server for structured storage. Writes land in
  # a durable buffer (central Postgres) and are pushed to providers' pg-agents
  # over the NVPN mesh; reads route via the placement index or fan out. The
  # nvpn sidecar publishes the listener (ports: above) for the whole shared
  # namespace. Auth: fixed password (PG_GATEWAY_PASSWORD, required — fail
  # closed). See docs/DECENTRALIZED_PG_PLAN.md.
  pg-gateway:
    build:
      context: ./pg-gateway
    container_name: nso_pg_gateway
    profiles: ["pg", "full"]
    # Must share the nvpn sidecar's netns: only that namespace can route
    # 10.44.x.y tunnel addresses to providers' pg-agents.
    network_mode: "service:nvpn"
    depends_on:
      db:
        condition: service_healthy
      nvpn:
        condition: service_healthy
        restart: true
    environment:
      PG_GATEWAY_LISTEN_ADDR: "0.0.0.0:5432"
      DB_API_URL: http://db:${DB_API_PORT:-4000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      # Required with --profile pg, but no interpolation guard here: a host
      # running only the storage stack does not need this var, and the gateway
      # itself refuses to start when it is empty (fail closed against open
      # cleartext auth).
      PG_GATEWAY_PASSWORD: ${PG_GATEWAY_PASSWORD:-}
      # Bearer token for providers' /pg/* endpoints (must match providers'
      # PG_AGENT_TOKEN). Optional but strongly recommended.
      PG_PROVIDER_TOKEN: ${PG_PROVIDER_TOKEN:-}
      # Broad writes (pk-less UPDATE/DELETE, INSERT..SELECT, DDL fallback)
      # are required by nostream's kind-5 flows and knex migrations.
      PG_ENABLE_BROAD_WRITES: "1"
      # Exclusive database-node placement: each row lands on exactly one
      # provider (hash-distributed). Raise only with a second pg provider.
      PG_DEFAULT_REPLICA_COUNT: "1"
      # Dispatch/apply diagnostics are debug-level. Keep the gateway at
      # `info`: the `pg_gateway=debug` scope emits "not catalog: <full SQL>"
      # for every read, including the entire IN(...) literal list, which grew
      # the json-file log to ~900MB. Set per_container to re-enable.
      RUST_LOG: "${RUST_LOG:-info,pg_gateway=info}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  nso_postgres_data:
  nvpn_data:
